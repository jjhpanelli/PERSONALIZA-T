<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eloi's Custom Gear - Personalizador Avanzado</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para capturar el mockup -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-8">
        <!-- Cabecera -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold tracking-tight text-amber-400">Eloi's Custom Gear</h1>
            <p class="text-sm text-slate-400">Diseña tu producto personalizado y haz tu pedido al instante</p>
        </header>

        <div class="grid lg:grid-cols-12 gap-8">
            
            <!-- Columna Izquierda: Vista Previa / Mockup (7 columnas) -->
            <div class="lg:col-span-7 flex flex-col items-center justify-center">
                <div id="captura-area" class="bg-slate-900 border border-slate-800 rounded-3xl p-8 relative shadow-2xl w-full aspect-square max-w-[500px] flex items-center justify-center overflow-hidden">
                    
                    <!-- Badge del producto actual -->
                    <span id="nombre-soporte-badge" class="absolute top-6 left-6 z-20 bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-bold px-3.5 py-1.5 rounded-full uppercase tracking-wider">Camiseta</span>

                    <!-- Contenedor del Mockup y Elementos Arrastrables -->
                    <div class="relative w-full h-full flex items-center justify-center">
                        <!-- Imagen Base del Mockup (Tus archivos de GitHub) -->
                        <img id="imagen-soporte" crossorigin="anonymous" src="camiseta.png" alt="Soporte" class="w-full h-full object-contain pointer-events-none select-none drop-shadow-2xl">

                        <!-- Elemento de Imagen Subida (Arrastrable) -->
                        <div id="user-image-container" class="absolute cursor-move hidden" style="width: 150px; top: 35%; left: 35%;">
                            <img id="user-uploaded-image" src="" class="w-full h-full object-contain pointer-events-none drop-shadow-md">
                        </div>

                        <!-- Elemento de Texto Personalizado (Arrastrable) -->
                        <div id="user-text-container" class="absolute cursor-move hidden" style="top: 60%; left: 35%;">
                            <span id="user-rendered-text" class="text-2xl font-black drop-shadow-md select-none" style="color: #ffffff;">Tu Texto</span>
                        </div>
                    </div>
                </div>
                <p class="text-xs text-slate-500 mt-3">💡 Puedes arrastrar la imagen o el texto con el ratón dentro del área del producto.</p>
            </div>

            <!-- Columna Derecha: Controles y Formulario (5 columnas) -->
            <div class="lg:col-span-5 space-y-6">
                
                <!-- 1. Selector de Soportes -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400">1. Elige tu Soporte</h3>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="cambiarSoporte('Camiseta', 'camiseta.png', 15.00)" class="soporte-btn border-2 border-amber-500 bg-slate-800/50 rounded-xl p-3 flex flex-col items-center gap-1.5 transition hover:border-amber-400">
                            <span class="text-xl">👕</span>
                            <span class="text-xs font-bold">Camiseta</span>
                            <span class="text-[10px] text-amber-400 font-semibold">15.00 €</span>
                        </button>
                        <button onclick="cambiarSoporte('Taza', 'taza.png', 10.00)" class="soporte-btn border-2 border-slate-800 bg-slate-900/50 rounded-xl p-3 flex flex-col items-center gap-1.5 transition hover:border-slate-600">
                            <span class="text-xl">☕</span>
                            <span class="text-xs font-bold">Taza</span>
                            <span class="text-[10px] text-amber-400 font-semibold">10.00 €</span>
                        </button>
                        <button onclick="cambiarSoporte('Gorra', 'gorra.png', 12.00)" class="soporte-btn border-2 border-slate-800 bg-slate-900/50 rounded-xl p-3 flex flex-col items-center gap-1.5 transition hover:border-slate-600">
                            <span class="text-xl">🧢</span>
                            <span class="text-xs font-bold">Gorra</span>
                            <span class="text-[10px] text-amber-400 font-semibold">12.00 €</span>
                        </button>
                    </div>
                </div>

                <!-- 2. Subir Diseño o Texto -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400">2. Tu Diseño</h3>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Subir Imagen / Logo</label>
                        <input type="file" id="subir-imagen" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500/10 file:text-amber-400 hover:file:bg-amber-500/20 cursor-pointer">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Añadir Texto Personalizado</label>
                        <input type="text" id="input-texto" placeholder="Escribe tu texto..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Tamaño del Diseño</label>
                            <input type="range" id="range-escala" min="50" max="300" value="150" class="w-full accent-amber-500">
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-slate-400 mb-1">Color del Texto</label>
                            <input type="color" id="color-texto" value="#ffffff" class="w-full h-8 bg-slate-950 border border-slate-800 rounded-xl cursor-pointer">
                        </div>
                    </div>
                </div>

                <!-- 3. Formulario de Datos y Envío -->
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400">3. Tus Datos de Envío</h3>
                    
                    <form id="order-form" class="space-y-3" onsubmit="event.preventDefault(); enviarPedido();">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Nombre y Apellidos *</label>
                            <input type="text" id="fact-nombre" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Teléfono / WhatsApp *</label>
                                <input type="tel" id="fact-telefono" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Email</label>
                                <input type="email" id="fact-email" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Dirección de Entrega</label>
                            <textarea id="fact-direccion" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500"></textarea>
                        </div>

                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/10 text-xs uppercase tracking-wider">
                            Finalizar Pedido por WhatsApp
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Script de Lógica Avanzada y Arrastre -->
    <script>
        let productoActual = 'Camiseta';
        let precioActual = 15.00;

        function cambiarSoporte(nombre, imagenUrl, precio) {
            productoActual = nombre;
            precioActual = precio;
            document.getElementById('imagen-soporte').src = imagenUrl;
            document.getElementById('nombre-soporte-badge').innerText = nombre;
        }

        // Subida de imagen de diseño
        document.getElementById('subir-imagen').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgContainer = document.getElementById('user-image-container');
                    const imgElement = document.getElementById('user-uploaded-image');
                    imgElement.src = event.target.result;
                    imgContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Control de texto personalizado
        const inputTexto = document.getElementById('input-texto');
        const textContainer = document.getElementById('user-text-container');
        const renderedText = document.getElementById('user-rendered-text');
        const colorTexto = document.getElementById('color-texto');

        inputTexto.addEventListener('input', function(e) {
            if (e.target.value.trim() !== '') {
                renderedText.innerText = e.target.value;
                textContainer.classList.remove('hidden');
            } else {
                textContainer.classList.add('hidden');
            }
        });

        colorTexto.addEventListener('input', function(e) {
            renderedText.style.color = e.target.value;
        });

        // Control de escala de la imagen
        document.getElementById('range-escala').addEventListener('input', function(e) {
            document.getElementById('user-image-container').style.width = e.target.value + 'px';
        });

        // Sistema de arrastre (Drag & Drop táctil y ratón) para elementos
        function hacerArrastrable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        hacerArrastrable(document.getElementById('user-image-container'));
        hacerArrastrable(document.getElementById('user-text-container'));

        // Función de Envío por WhatsApp blindada sin errores
        function enviarPedido() {
            const nombre = document.getElementById('fact-nombre').value;
            const telefono = document.getElementById('fact-telefono').value;
            const direccion = document.getElementById('fact-direccion').value;
            const email = document.getElementById('fact-email').value;

            if (!nombre || !telefono) {
                alert("Por favor, completa al menos tu nombre y teléfono.");
                return;
            }

            const textoWhatsApp = `*¡Nuevo Pedido - Eloi's Custom Gear!*%0A%0A` +
                `👕 *Soporte:* ${productoActual} (${precioActual.toFixed(2)}€)%0A` +
                `👤 *Cliente:* ${encodeURIComponent(nombre)}%0A` +
                `📞 *Teléfono:* ${encodeURIComponent(telefono)}%0A` +
                `📧 *Email:* ${encodeURIComponent(email || 'No especificado')}%0A` +
                `🏠 *Dirección:* ${encodeURIComponent(direccion || 'No especificada')}`;

            // Abrir WhatsApp con los datos completos
            window.open(`https://wa.me/34650013500?text=${textoWhatsApp}`, '_blank');
            alert("¡Pedido generado con éxito! Se ha abierto WhatsApp con todos los detalles.");
        }
    </script>
</body>
</html>
